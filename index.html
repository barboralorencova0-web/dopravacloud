<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(Nejen) dopravní galerie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 24px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 10px;
        }
        .btn-add {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        .search-input {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            text-align: right;
            outline: none;
            width: 140px;
        }
        .search-input::placeholder {
            color: #888;
        }
        .category-section {
            margin-bottom: 35px;
        }
        .category-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .photo-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .photo-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            cursor: pointer;
        }
        .photo-info {
            padding: 8px;
            font-size: 12px;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .photo-info strong {
            color: #fff;
            font-size: 13px;
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #ff4444;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Modaly */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-content input, .modal-content select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save { background: #00FFFF; color: #000; }
        .btn-cancel { background: #333; color: #fff; }

        /* Detail fotky */
        .viewer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
            max-height: 90%;
            gap: 15px;
        }
        .viewer-content img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .btn-download {
            background: #00FFFF;
            color: #000;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            color: #fff;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>

    <!-- Firebase SDK (pouze Firestore databáze, která je zdarma) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
           const firebaseConfig = {
            apiKey: "AIzaSyCJb9o0ydoxgx4FeDeZKfw3is0_N_nMato",
            authDomain: "nejen-dopravni-galerie.firebaseapp.com",
            projectId: "nejen-dopravni-galerie",
            storageBucket: "nejen-dopravni-galerie.firebasestorage.app",
            messagingSenderId: "334907291884",
            appId: "1:334907291884:web:402717465d1b5c7de5cdc9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const categoriesConfig = [
            { name: 'Autobusy', emoji: '🚌' },
            { name: 'Tramvaje', emoji: '🚋' },
            { name: 'Vlaky', emoji: '🚂' },
            { name: 'Trolejbusy', emoji: '🚎' },
            { name: 'Letadla', emoji: '✈️' },
            { name: 'Ostatní', emoji: '🏢' }
        ];

        let photos = [];

        window.openModal = function() {
            document.getElementById('addModal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('addModal').style.display = 'none';
        }

        window.viewPhoto = function(src) {
            document.getElementById('fullImage').src = src;
            document.getElementById('downloadBtn').href = src;
            document.getElementById('viewerModal').style.display = 'flex';
        }

        window.closeViewer = function(e) {
            document.getElementById('viewerModal').style.display = 'none';
        }

        // Pomocná funkce pro kompresi fotky v prohlížeči (zcela zdarma)
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1200; // Maximální rozměr pro uložení do databáze

                        if (width > height && width > maxDim) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else if (height > maxDim) {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8)); // Převedení na zkomprimovaný Base64 text
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.savePhoto = async function() {
            const fileInput = document.getElementById('imageInput');
            const category = document.getElementById('categoryInput').value;
            const evNumber = document.getElementById('evNumberInput').value;
            const vehicleType = document.getElementById('typeInput').value;
            const location = document.getElementById('locationInput').value;
            const photoDate = document.getElementById('dateInput').value;
            const info = document.getElementById('infoInput').value;

            if (fileInput.files.length === 0) {
                alert('Vyber prosím fotku.');
                return;
            }

            document.getElementById('loadingOverlay').style.display = 'flex';

            try {
                // Zmenšení fotky a převedení do textu přímo v prohlížeči
                const compressedDataUrl = await compressImage(fileInput.files[0]);

                // Uložení textových dat do Firestore databáze (zcela zdarma, bez Storage)
                await addDoc(collection(db, "photos"), {
                    src: compressedDataUrl,
                    category: category,
                    evNumber: evNumber,
                    vehicleType: vehicleType,
                    location: location,
                    photoDate: photoDate,
                    info: info,
                    createdAt: Date.now()
                });

                closeModal();
                fileInput.value = '';
                document.getElementById('evNumberInput').value = '';
                document.getElementById('typeInput').value = '';
                document.getElementById('locationInput').value = '';
                document.getElementById('dateInput').value = '';
                document.getElementById('infoInput').value = '';

                await loadPhotos();
            } catch (error) {
                console.error("Chyba při ukládání: ", error);
                alert("Při ukládání došlo k chybě. Zkus to prosím znovu.");
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        window.deletePhoto = async function(id) {
            if (!confirm("Opravdu chceš tuto fotku smazat?")) return;
            document.getElementById('loadingOverlay').style.display = 'flex';

            try {
                await deleteDoc(doc(db, "photos", id));
                await loadPhotos();
            } catch (error) {
                console.error("Chyba při mazání: ", error);
                alert("Nepodařilo se smazat.");
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        window.renderGallery = function() {
            const container = document.getElementById('categoriesContainer');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            categoriesConfig.forEach(cat => {
                const catPhotos = photos.filter(p => {
                    const matchCategory = p.category === cat.name;
                    const fullText = `${p.evNumber || ''} ${p.vehicleType || ''} ${p.location || ''} ${p.photoDate || ''} ${p.info || ''}`.toLowerCase();
                    const matchSearch = fullText.includes(searchText) || searchText === '';
                    return matchCategory && matchSearch;
                });

                if (catPhotos.length > 0 || searchText === '') {
                    const section = document.createElement('div');
                    section.className = 'category-section';

                    let photosHtml = '';
                    catPhotos.forEach(photo => {
                        photosHtml += `
                            <div class="photo-card">
                                <img src="${photo.src}" alt="${photo.category}" onclick="viewPhoto('${photo.src}')">
                                <div class="photo-info">
                                    ${photo.evNumber ? `<strong>Ev. č. ${photo.evNumber}</strong>` : ''}
                                    ${photo.vehicleType ? `<span>${photo.vehicleType}</span>` : ''}
                                    ${photo.location ? `<span style="color: #999;">📍 ${photo.location}</span>` : ''}
                                    ${photo.photoDate ? `<span style="color: #aaa; font-size: 11px;">📅 ${photo.photoDate}</span>` : ''}
                                    ${photo.info ? `<span style="color: #00FFFF; font-size: 11px;">💡 ${photo.info}</span>` : ''}
                                </div>
                                <button class="delete-btn" onclick="deletePhoto('${photo.id}')" title="Smazat">×</button>
                            </div>
                        `;
                    });

                    if (catPhotos.length === 0) {
                        photosHtml = '<p style="color: #555; font-size: 14px; margin: 0; grid-column: 1/-1;">Zatím žádné fotky</p>';
                    }

                    section.innerHTML = `
                        <div class="category-title">${cat.emoji} ${cat.name}</div>
                        <div class="category-grid">${photosHtml}</div>
                    `;
                    container.appendChild(section);
                }
            });
        }

        async function loadPhotos() {
            try {
                const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                photos = [];
                querySnapshot.forEach((docSnap) => {
                    photos.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGallery();
            } catch (error) {
                console.error("Chyba při načítání dat: ", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadPhotos();
            document.getElementById('searchInput').addEventListener('input', renderGallery);
        });
    </script>
</head>
<body>

    <div id="loadingOverlay">Zpracovávám a ukládám do cloudu...</div>

    <h1>(Nejen) dopravní galerie</h1>

    <div class="top-bar">
        <button class="btn-add" onclick="openModal()">+ přidej fotku</button>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 vyhledej...">
    </div>

    <div id="categoriesContainer"></div>

    <!-- Modal pro přidání -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 style="margin: 0 0 5px 0;">Nová fotka</h3>
            <label style="font-size: 12px; color: #aaa;">Vybrat fotku:</label>
            <input type="file" id="imageInput" accept="image/*">
            
            <label style="font-size: 12px; color: #aaa;">Kategorie:</label>
            <select id="categoryInput">
                <option value="Autobusy">Autobusy</option>
                <option value="Tramvaje">Tramvaje</option>
                <option value="Vlaky">Vlaky</option>
                <option value="Trolejbusy">Trolejbusy</option>
                <option value="Letadla">Letadla</option>
                <option value="Ostatní">Ostatní</option>
            </select>

            <input type="text" id="evNumberInput" placeholder="Evidenční číslo">
            <input type="text" id="typeInput" placeholder="Typ (např. Solaris)">
            <input type="text" id="locationInput" placeholder="Místo vyfocení">
            <input type="date" id="dateInput">
            <input type="text" id="infoInput" placeholder="Další info / poznámka">

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Zrušit</button>
                <button class="btn-save" onclick="savePhoto()">Uložit</button>
            </div>
        </div>
    </div>

    <!-- Modal pro zobrazení fotky -->
    <div class="modal" id="viewerModal" onclick="closeViewer(event)">
        <div class="viewer-content" onclick="event.stopPropagation()">
            <img id="fullImage" src="" alt="Detail">
            <a id="downloadBtn" class="btn-download" download="doprava.jpg">Stáhnout fotku</a>
            <button class="btn-cancel" onclick="document.getElementById('viewerModal').style.display='none'" style="width: 100%;">Zavřít</button>
        </div>
    </div>

</body>
</html>
